name: CI

on:
  push:
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    uses: tty-pt/ci/.github/workflows/all-in-one.yml@main
    with:
      name: libhyle
      run_tests: true
      deps: "libcorm,liblemma"
      deps_pacman: "libstele,libcorm,liblemma"
      deps_winget: "mingw-w64-x86_64-pcre2"
      deps_winget_tty: "libstele,libcorm,liblemma"
      # Manual runs (workflow_dispatch) only build the platforms that produce a Node prebuild.
      publish_to: ${{ github.event_name == 'workflow_dispatch' && 'rpm,brew,winget' || 'deb,apk,rpm,pacman,brew,openbsd,winget' }}
      # Only tags publish; branches, pull requests and manual runs build, verify and stop.
      run_publish: ${{ startsWith(github.ref, 'refs/tags/') }}
      # Node: every platform's package job also builds a self-contained Node-API prebuild; the npm
      # tarball bundling them is verified on each platform and then published as-is.
      node_addon: true
      node_addon_expect: "linux-x64,darwin-arm64,darwin-x64,win32-x64"
      npm_build: "npm run build:wasm"
    secrets: inherit
